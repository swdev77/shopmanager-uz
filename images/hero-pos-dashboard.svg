    <rect x="242" y="242" width="22" height="50" rx="4" fill="#9EC5FE"/>
    <rect x="292" y="248" width="22" height="44" rx="4" fill="#CFE2FF"/>
    <rect x="342" y="226" width="22" height="66" rx="4" fill="#6EA8FE"/>
    <rect x="392" y="216" width="22" height="76" rx="4" fill="#3D8BFD"/>
    <rect x="442" y="208" width="22" height="84" rx="4" fill="#0052CC"/>
    <rect x="492" y="198" width="22" height="94" rx="4" fill="#000080"/>

    <!-- Smooth Trend Line -->
    <path d="M203 250 L253 236 L303 242 L353 220 L403 210 L453 202 L503 192" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="503" cy="192" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Bottom Inventory Table Preview -->
    <rect x="160" y="324" width="398" height="74" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="176" y="344" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">So'nggi sotilgan mahsulotlar (Kassa #1)</text>
    <text x="176" y="366" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="11">1. Coca-Cola 1.5L (Shtrix: 47800124) — 2 dona</text>
    <text x="478" y="366" fill="#000080" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">24,000 so'm</text>
    <text x="176" y="385" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="11">2. Shakar 1 kg (Ombor: 340 kg) — 5 kg</text>
    <text x="478" y="385" fill="#000080" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">65,000 so'm</text>
  </g>

  <!-- Floating POS Cashier Receipt & Barcode Card (Right Side) -->
  <g filter="url(#floatShadow)">
    <rect x="478" y="138" width="212" height="308" rx="14" fill="#FFFFFF" stroke="#CFE2FF" stroke-width="2"/>

    <!-- Card Header -->
    <rect x="478" y="138" width="212" height="46" rx="14" fill="#000080"/>
    <rect x="478" y="168" width="212" height="16" fill="#000080"/>
    <text x="498" y="166" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Cashier Terminal</text>
    <rect x="622" y="150" width="52" height="22" rx="6" fill="#10B981"/>
    <text x="631" y="165" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">POS #1</text>

    <!-- Receipt Items -->
    <text x="498" y="206" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">CHEK #00482</text>
    <line x1="498" y1="214" x2="670" y2="214" stroke="#E2E8F0" stroke-dasharray="4 3"/>

    <text x="498" y="234" fill="#1E293B" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">Sut Musaffo 1L × 2</text>
    <text x="618" y="234" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">26,000</text>

    <text x="498" y="256" fill="#1E293B" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">Qahva Jacobs × 1</text>
    <text x="618" y="256" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">68,000</text>

    <text x="498" y="278" fill="#1E293B" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">Shokolad Nest × 3</text>
    <text x="618" y="278" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">45,000</text>

    <text x="498" y="298" fill="#059669" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">Mijoz bonusi (5%):</text>
    <text x="618" y="298" fill="#059669" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">-6,950</text>

    <line x1="498" y1="310" x2="670" y2="310" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Total Amount Box -->
    <rect x="494" y="320" width="180" height="40" rx="8" fill="#EEF5FF"/>
    <text x="506" y="345" fill="#000080" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">JAMI:</text>
    <text x="562" y="345" fill="#000080" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">132,050 so'm</text>

    <!-- Barcode Graphic -->
    <g fill="#1E293B">
      <rect x="506" y="372" width="3" height="28"/>
      <rect x="513" y="372" width="1.5" height="28"/>
      <rect x="518" y="372" width="4" height="28"/>
      <rect x="526" y="372" width="2" height="28"/>
      <rect x="531" y="372" width="1.5" height="28"/>
      <rect x="536" y="372" width="5" height="28"/>
      <rect x="545" y="372" width="2" height="28"/>
      <rect x="550" y="372" width="3.5" height="28"/>
      <rect x="557" y="372" width="1.5" height="28"/>
      <rect x="562" y="372" width="4" height="28"/>
      <rect x="570" y="372" width="2" height="28"/>
      <rect x="575" y="372" width="4.5" height="28"/>
      <rect x="583" y="372" width="1.5" height="28"/>
      <rect x="588" y="372" width="3" height="28"/>
      <rect x="595" y="372" width="2" height="28"/>
      <rect x="601" y="372" width="5" height="28"/>
      <rect x="610" y="372" width="1.5" height="28"/>
      <rect x="615" y="372" width="3.5" height="28"/>
      <rect x="622" y="372" width="2" height="28"/>
      <rect x="628" y="372" width="4" height="28"/>
      <rect x="636" y="372" width="1.5" height="28"/>
      <rect x="641" y="372" width="3" height="28"/>
      <rect x="648" y="372" width="4.5" height="28"/>
      <rect x="656" y="372" width="2" height="28"/>
      <rect x="661" y="372" width="3" height="28"/>
    </g>
    <!-- Laser Scan Line across Barcode -->
    <line x1="496" y1="386" x2="672" y2="386" stroke="#EF4444" stroke-width="2" stroke-opacity="0.85"/>

    <!-- Payment Success Button -->
    <rect x="494" y="410" width="180" height="24" rx="6" fill="url(#greenGrad)"/>
    <text x="536" y="426" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">✓ To'lov qabul qilindi</text>
  </g>
</svg>
