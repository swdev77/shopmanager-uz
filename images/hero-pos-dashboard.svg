<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="720" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EEF5FF"/>
      <stop offset="100%" stop-color="#DCEBFE"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000080"/>
      <stop offset="100%" stop-color="#0052CC"/>
    </linearGradient>
    <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0052CC" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0052CC" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#001A4D" flood-opacity="0.12"/>
    </filter>
    <filter id="floatShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#001A4D" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="720" height="480" rx="20" fill="url(#bgGrad)"/>
  <circle cx="650" cy="70" r="110" fill="#0052CC" fill-opacity="0.06"/>
  <circle cx="80" cy="420" r="95" fill="#000080" fill-opacity="0.05"/>

  <!-- Main POS Dashboard Window -->
