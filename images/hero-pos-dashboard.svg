    <rect x="34" y="32" width="540" height="380" rx="14" fill="#FFFFFF" stroke="#D8E6F8" stroke-width="1.5"/>

    <!-- Window Top Header Bar -->
    <path d="M34 46C34 38.268 40.268 32 48 32H560C567.732 32 574 38.268 574 46V74H34V46Z" fill="url(#primaryGrad)"/>
    <circle cx="56" cy="53" r="5.5" fill="#FF5F56"/>
    <circle cx="74" cy="53" r="5.5" fill="#FFBD2E"/>
    <circle cx="92" cy="53" r="5.5" fill="#27C93F"/>
    <text x="116" y="58" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">ShopManager POS &amp; Ombor — v2.33.2025</text>

    <!-- Status Pill in Header -->
    <rect x="468" y="42" width="90" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.16"/>
    <circle cx="481" cy="53" r="4" fill="#34D399"/>
    <text x="491" y="57" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">Onlayn Baza</text>

    <!-- Left Navigation Sidebar -->
    <rect x="34" y="74" width="110" height="338" fill="#F8FAFC"/>
    <line x1="144" y1="74" x2="144" y2="412" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Sidebar Active Item: Kassa / Sotuv -->
    <rect x="44" y="90" width="90" height="34" rx="7" fill="#E3F2FD"/>
    <rect x="44" y="90" width="4" height="34" rx="2" fill="#000080"/>
    <text x="58" y="111" fill="#000080" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Kassa POS</text>

    <!-- Sidebar Other Items -->
    <text x="58" y="148" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">Omborxona</text>
    <text x="58" y="182" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">Hisobotlar</text>
    <text x="58" y="216" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">Mijozlar CRM</text>
    <text x="58" y="250" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">Kirim / Chiqim</text>

    <!-- Sidebar DB Indicator -->
    <rect x="44" y="356" width="90" height="42" rx="8" fill="#EEF5FF" stroke="#CFE2FF"/>
    <text x="52" y="373" fill="#000080" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">Firebird 5.0</text>
    <text x="52" y="388" fill="#059669" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600">● Faol server</text>

    <!-- KPI Cards Row -->
    <!-- Card 1: Kunlik Savdo -->
    <rect x="160" y="90" width="132" height="74" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="172" y="110" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">BUGUNGI SAVDO</text>
    <text x="172" y="133" fill="#000080" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">18.4 mln</text>
    <rect x="172" y="142" width="54" height="15" rx="4" fill="#D1FAE5"/>
    <text x="178" y="153" fill="#059669" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">+22.5%</text>

    <!-- Card 2: Ombor qoldig'i -->
    <rect x="304" y="90" width="124" height="74" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="316" y="110" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">OMBOR QOLDIG'I</text>
    <text x="316" y="133" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">4,280 ta</text>
    <text x="316" y="152" fill="#0052CC" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600">Real vaqt rejimida</text>

    <!-- Card 3: Mijozlar / Cheklar -->
    <rect x="440" y="90" width="118" height="74" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="452" y="110" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">CHEKLAR SONI</text>
    <text x="452" y="133" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">164 ta</text>
    <text x="452" y="152" fill="#D97706" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600">★ 98% sodiqlik</text>

    <!-- Sales Analytics Chart Box -->
