    <text x="176" y="200" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Savdo va daromad tahlili</text>
    <text x="470" y="200" fill="#0052CC" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">Haftalik hisobot</text>

    <!-- Grid Lines -->
    <line x1="176" y1="222" x2="540" y2="222" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="176" y1="252" x2="540" y2="252" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="176" y1="282" x2="540" y2="282" stroke="#F1F5F9" stroke-width="1"/>

